<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد تعاملی مقایسه مانیتورها</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --border-color: #333;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --accent-color: #00e676;
        }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h2 { text-align: center; margin-bottom: 20px; color: var(--accent-color); }
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background-color: var(--surface-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { margin-bottom: 5px; font-size: 14px; color: var(--text-secondary); }
        .filter-group select, .filter-group input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: inherit;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--surface-color);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }
        th { background-color: #2c2c2c; font-weight: bold; }
        tr:hover { background-color: #2a2a2a; }
        .highlight { color: var(--accent-color); font-weight: bold; }
        .ips-badge { background-color: #2196f3; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .va-badge { background-color: #ff9800; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .count-bar { margin-bottom: 15px; font-size: 14px; color: var(--text-secondary); }
    </style>
</head>
<body>

<div class="container">
    <h2>داشبورد تخصصی مانیتورهای مهندسی</h2>
    
    <div class="filters">
        <div class="filter-group">
            <label for="brandFilter">برند:</label>
            <select id="brandFilter">
                <option value="all">همه برندها</option>
                <option value="LG">LG</option>
                <option value="ASUS">ASUS</option>
                <option value="MSI">MSI</option>
                <option value="SAMSUNG">SAMSUNG</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="panelFilter">نوع پنل:</label>
            <select id="panelFilter">
                <option value="all">همه پنل‌ها</option>
                <option value="IPS">IPS (مناسب متن)</option>
                <option value="VA">VA (کنتراست بالا)</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="syncFilter">تکنولوژی Sync:</label>
            <select id="syncFilter">
                <option value="all">همه</option>
                <option value="G-Sync Comp">G-Sync Compatible (Nvidia)</option>
                <option value="FreeSync">FreeSync</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="ergoFilter">ارگونومی (پایه):</label>
            <select id="ergoFilter">
                <option value="all">همه موارد</option>
                <option value="کامل">تنظیم کامل (آسانسوری/چرخش)</option>
            </select>
        </div>
    </div>

    <div class="count-bar" id="resultCount">تعداد نتایج: 15</div>

    <table>
        <thead>
            <tr>
                <th>برند و مدل</th>
                <th>پنل / رفرش‌ریت</th>
                <th>Sync</th>
                <th>HDR</th>
                <th>پورت‌های اصلی</th>
                <th>ارگونومی</th>
                <th>محافظت چشم</th>
                <th>قیمت (میلیون)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Data will be injected here via JS -->
        </tbody>
    </table>
</div>

<script>
    const monitors = [
        { brand: "LG", model: "27U421", panelType: "VA", panelDesc: "VA (Curved)", refresh: "100Hz", sync: "FreeSync", hdr: "ندارد", ports: "HDMI, DP", ergo: "Tilt", eye: "Reader Mode / Flicker Safe", price: 8.5 },
        { brand: "LG", model: "27U411A-B", panelType: "IPS", panelDesc: "IPS", refresh: "120Hz", sync: "FreeSync", hdr: "ندارد", ports: "HDMI, DP", ergo: "Tilt", eye: "Reader Mode / Flicker Safe", price: 9.2 },
        { brand: "LG", model: "27G411A-B", panelType: "IPS", panelDesc: "IPS", refresh: "144Hz", sync: "G-Sync Comp / FreeSync", hdr: "HDR10", ports: "HDMI, DP", ergo: "Tilt", eye: "Flicker Safe", price: 11.5 },
        { brand: "LG", model: "27GQ50F", panelType: "VA", panelDesc: "VA", refresh: "165Hz", sync: "FreeSync Premium", hdr: "ندارد", ports: "HDMI, DP", ergo: "Tilt", eye: "Reader Mode / Flicker Safe", price: 10.8 },
        { brand: "LG", model: "UltraGear 27GS50F", panelType: "VA", panelDesc: "VA", refresh: "180Hz", sync: "FreeSync", hdr: "HDR10", ports: "HDMI, DP", ergo: "Tilt", eye: "Low Blue Light", price: 11.2 },
        { brand: "ASUS", model: "TUF VG279Q3R", panelType: "IPS", panelDesc: "Fast IPS", refresh: "180Hz", sync: "FreeSync / ELMB", hdr: "HDR10", ports: "HDMI, DP", ergo: "Tilt", eye: "ASUS Eye Care", price: 12.5 },
        { brand: "ASUS", model: "TUF VG27VQ3B", panelType: "VA", panelDesc: "VA (Curved)", refresh: "180Hz", sync: "FreeSync Premium", hdr: "HDR10", ports: "HDMI, DP", ergo: "Tilt", eye: "ASUS Eye Care", price: 11.8 },
        { brand: "ASUS", model: "VY279HGR", panelType: "IPS", panelDesc: "IPS", refresh: "120Hz", sync: "FreeSync", hdr: "ندارد", ports: "HDMI", ergo: "Tilt", eye: "Eye Care+", price: 9.5 },
        { brand: "ASUS", model: "VU279CFE", panelType: "IPS", panelDesc: "IPS", refresh: "100Hz", sync: "FreeSync", hdr: "ندارد", ports: "Type-C (15W), HDMI", ergo: "Tilt", eye: "Eye Care (TÜV)", price: 8.9 },
        { brand: "SAMSUNG", model: "Odyssey G3", panelType: "VA", panelDesc: "VA", refresh: "165Hz", sync: "FreeSync Premium", hdr: "ندارد", ports: "HDMI, DP", ergo: "کامل (ارتفاع، چرخش، تیلت)", eye: "Eye Saver Mode", price: 10.5 },
        { brand: "MSI", model: "PRO MP275", panelType: "IPS", panelDesc: "IPS", refresh: "100Hz", sync: "Adaptive Sync", hdr: "ندارد", ports: "HDMI, VGA", ergo: "Tilt", eye: "EyesErgo / Less Blue Light", price: 7.8 },
        { brand: "MSI", model: "PRO MP275 E2", panelType: "IPS", panelDesc: "IPS", refresh: "120Hz", sync: "Adaptive Sync", hdr: "ندارد", ports: "HDMI, DP", ergo: "Tilt", eye: "EyesErgo PRO", price: 8.5 },
        { brand: "MSI", model: "G275L E14", panelType: "VA", panelDesc: "VA", refresh: "100Hz", sync: "FreeSync", hdr: "ندارد", ports: "HDMI", ergo: "Tilt", eye: "Less Blue Light", price: 8.2 },
        { brand: "MSI", model: "G274F", panelType: "IPS", panelDesc: "Rapid IPS", refresh: "180Hz", sync: "G-Sync Comp", hdr: "HDR Ready", ports: "HDMI, DP", ergo: "Tilt", eye: "Less Blue Light PRO", price: 13.5 },
        { brand: "MSI", model: "MD2712PW", panelType: "IPS", panelDesc: "IPS", refresh: "100Hz", sync: "Adaptive Sync", hdr: "ندارد", ports: "Type-C (15W), HDMI", ergo: "کامل (ارتفاع، چرخش، تیلت)", eye: "Anti-Flicker", price: 11.0 }
    ];

    const tableBody = document.getElementById('tableBody');
    const resultCount = document.getElementById('resultCount');

    function renderTable(data) {
        tableBody.innerHTML = '';
        data.forEach(item => {
            const row = document.createElement('tr');
            
            let panelBadge = item.panelType === 'IPS' ? 'ips-badge' : 'va-badge';
            let syncHighlight = item.sync.includes('G-Sync') ? 'highlight' : '';

            row.innerHTML = `
                <td><strong>${item.brand}</strong> ${item.model}</td>
                <td><span class="${panelBadge}">${item.panelDesc}</span> <br/> <small>${item.refresh}</small></td>
                <td class="${syncHighlight}">${item.sync}</td>
                <td>${item.hdr}</td>
                <td dir="ltr" style="text-align: right;">${item.ports}</td>
                <td>${item.ergo}</td>
                <td><small>${item.eye}</small></td>
                <td>${item.price}</td>
            `;
            tableBody.appendChild(row);
        });
        resultCount.innerText = `تعداد نتایج یافت شده: ${data.length}`;
    }

    function applyFilters() {
        const brand = document.getElementById('brandFilter').value;
        const panel = document.getElementById('panelFilter').value;
        const sync = document.getElementById('syncFilter').value;
        const ergo = document.getElementById('ergoFilter').value;

        const filtered = monitors.filter(m => {
            const matchBrand = brand === 'all' || m.brand === brand;
            const matchPanel = panel === 'all' || m.panelType === panel;
            const matchSync = sync === 'all' || m.sync.includes(sync);
            const matchErgo = ergo === 'all' || m.ergo.includes(ergo);
            return matchBrand && matchPanel && matchSync && matchErgo;
        });

        renderTable(filtered);
    }

    // Attach Event Listeners
    document.querySelectorAll('select').forEach(el => {
        el.addEventListener('change', applyFilters);
    });

    // Initial Render
    renderTable(monitors);
</script>
</body>
</html>
